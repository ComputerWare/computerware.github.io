<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music | Evan Sergievich</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Use the same :root and base styles from the main page */
        :root { --accent: #ffffff; --secondary: #00f2ff; --bg-dark: #050505; --glass: rgba(255,255,255,0.03); }
        body { background: var(--bg-dark); color: white; font-family: 'Montserrat', sans-serif; margin: 0; }
        
        .bg-fixed {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(5,5,5,0.8), rgba(5,5,5,0.9)), url('https://images.unsplash.com/photo-1514525253361-bee8a187499b?q=80&w=2000');
            background-size: cover; z-index: -1;
        }

        nav { display: flex; justify-content: space-between; padding: 1.5rem 8%; background: rgba(5,5,5,0.5); backdrop-filter: blur(15px); }
        .logo { font-family: 'Syncopate'; font-weight: 700; letter-spacing: 4px; text-decoration: none; color: white; }
        
        .container { padding: 100px 10%; max-width: 1200px; margin: 0 auto; }
        h1 { font-family: 'Syncopate'; font-size: 3rem; letter-spacing: 10px; margin-bottom: 50px; border-bottom: 2px solid var(--secondary); display: inline-block; }
        
        .release-grid { display: grid; grid-template-columns: 1fr; gap: 40px; margin-top: 40px; }
        .release-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="bg-fixed"></div>
    <nav>
        <a href="index.html" class="logo">EVAN <span>SERGIEVICH</span></a>
    </nav>
    <div class="container">
        <h1>MY MUSIC</h1>
        <div class="release-grid">
            <div class="release-card">
                <h3 style="font-family: 'Syncopate'; margin-bottom: 15px;">Latest EP</h3>
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/album/29D68SAgwzb9HXLrUk56N1?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
            <!-- Future release slots -->
            <div class="release-card" style="opacity: 0.5;">
                <p>New Project Incoming 2026...</p>
            </div>
        </div>
    </div>
</body>
</html>
